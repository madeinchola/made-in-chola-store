# Configuración del CLI de Supabase para el proyecto de la NUBE de Made In Chola (ref kymleecfbmugdwfzrxee).
# Solo existe este Supabase: no hay servidor local. Lo único que lee el CLI de aquí es el identificador del proyecto y,
# al DESPLEGAR cada Edge Function (`npx supabase functions deploy <nombre> --project-ref <ref> --use-api`), si exige un JWT.
# Los ajustes de Auth (registro cerrado, contraseña mínima de 8, límites de tasa, SMTP, URLs de redirección) se cambian en el
# panel de Supabase, no aquí: están anotados en Sprints/SPRINT_19_Acciones_Manuales.md.
project_id = "made-in-chola"

# Sprint 1 — login/register son públicos (no llevan JWT); la seguridad la dan rate limit + validación propia.
[functions.login]
verify_jwt = false

[functions.register]
verify_jwt = false

[functions.deactivate-account]
verify_jwt = true

[functions.set-password]
verify_jwt = true

[functions.update-contact]
verify_jwt = true

[functions.change-password]
verify_jwt = true

# Carrito (S7): lo usan también los INVITADOS (sin sesión). La función identifica por sí misma al usuario
# (verifica su JWT con Auth) o al invitado (token opaco) y aplica los topes de tasa de D-02.
[functions.cart]
verify_jwt = false

# Checkout (S10): TODA compra requiere cuenta. La función verifica el JWT por sí misma con Auth (igual que `cart`) y aplica los
# topes de tasa; las funciones SQL de pedidos solo las ejecuta service_role.
[functions.checkout]
verify_jwt = false
