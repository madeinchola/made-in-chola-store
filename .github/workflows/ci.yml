name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  # Valores de relleno: las pruebas unitarias y el build no hablan con ninguna base de datos.
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_APP_ENV: local

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
      - run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret

# Las pruebas contra la base (integración, pgTAP y E2E) NO corren aquí: son destructivas y se ejecutan a mano contra el
# proyecto de Supabase de la nube con `npm run test:integration` y `npm run e2e` (necesitan .env.e2e). El job `backend`
# (Supabase local en Docker) se quitó el 2026-10-30 y el Supabase local dejó de existir el 2026-11-05.
