name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_APP_ENV: local

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
        env:
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
      - run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret

# Las pruebas de base de datos, Edge Functions, integración y E2E (que necesitan Supabase local)
# NO corren aquí: se ejecutan en local con `npm run verify`. El job `backend` se quitó el
# 2026-10-30 por decisión del dueño del proyecto; la versión anterior está en el commit 9d886df.
